[project]
name = "ghidra-manuals"
version = "0.1.0"
description = "Download Ghidra processor manuals into a Ghidra installation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "filetype>=1.2.0",
    "requests>=2.33.1",
]

[project.scripts]
ghidra-manuals = "ghidra_manuals.cli:cli"

[project.urls]
Homepage = "https://github.com/clouedoc/ghidra-manuals"
Upstream = "https://github.com/meenmachine1/ghidra-manuals"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
